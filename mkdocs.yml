site_name: AirDB
site_description: Decentralized, Local-First P2P Database Synchronization Engine over Bluetooth Low Energy
site_author: AirDB Authors
site_url: https://untacorp.github.io/airdb/
repo_name: untacorp/airdb
repo_url: https://github.com/untacorp/airdb

docs_dir: docs
site_dir: site

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.tracking
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link

extra_javascript:
  - https://cdnjs.cloudflare.com/ajax/libs/mathjax/3.2.2/es5/tex-mml-chtml.js

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.arithmatex:
      generic: true

nav:
  - Overview: index.md
  - Getting Started:
      - Quickstart: GETTING_STARTED.md
      - Apple Platforms: AirDbKit.md
  - Architecture:
      - Engine & Causality: ARCHITECTURE.md
      - Wire Protocol: PROTOCOL_SPEC.md
      - Coding Standards: CODING_STANDARDS.md
  - BYOD Cookbooks:
      - Android Room: cookbooks/room-android.md
      - SQLDelight Multiplatform: cookbooks/sqldelight.md
      - Android SQLite WAL: cookbooks/sqlite-android.md
      - Apple GRDB.swift: cookbooks/grdb-ios.md
      - Apple SwiftData: cookbooks/swiftdata-ios.md
      - Apple CoreData: cookbooks/coredata-ios.md
      - Apple Native SQLite: cookbooks/sqlite-apple.md
      - In-Memory KV: cookbooks/in-memory-kv.md
  - Architecture Decisions:
      - 0001 Sans-I/O Architecture: adr/0001-sans-io-architecture.md
      - 0002 HLC Conflict Resolution: adr/0002-hlc-conflict-resolution.md
      - 0003 Single-Flight GATT Queue: adr/0003-single-flight-gatt-queue.md
      - 0004 Durable SQLite Persistence: adr/0004-sqlite-persistence-seam.md
      - 0005 Zero-Trust Cryptographic Mesh: adr/0005-zero-trust-cryptographic-mesh.md
  - Security & FAQ:
      - Security Policy: SECURITY.md
      - Frequently Asked Questions: FAQ.md
  - Reference & Publishing:
      - Publishing Guide: PUBLISHING.md
      - Contributing: CONTRIBUTING.md
      - Changelog: CHANGELOG.md
